server.port=${PORT:8080}


spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flashquiz}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Without this a pooled DB connection stays checked out for the whole request,
# including the model call that can take up to openrouter.read-timeout.
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.base-url=https://openrouter.ai/api/v1
openrouter.model=openai/gpt-3.5-turbo
openrouter.connect-timeout=3s
openrouter.read-timeout=30s
